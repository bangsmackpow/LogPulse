name: Build & Release Multi-Platform Desktop Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            output_name: logpulse-windows-amd64.exe
            asset_path: build/bin/logpulse.exe
            archive_name: logpulse-windows-amd64.zip

          - os: macos-latest
            platform: darwin/universal
            output_name: logpulse-darwin-universal
            asset_path: build/bin/LogPulse.app
            archive_name: logpulse-macos-universal.zip

          - os: ubuntu-22.04
            platform: linux/amd64
            output_name: logpulse-linux-amd64
            asset_path: build/bin/logpulse
            archive_name: logpulse-linux-amd64.tar.gz

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.9.2

      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build Desktop Application (Wails)
        run: |
          wails build -platform ${{ matrix.platform }} -clean

      - name: Package Windows Binary
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path build/bin/logpulse.exe -DestinationPath ${{ matrix.archive_name }}

      - name: Package macOS Application
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/bin/LogPulse.app ${{ matrix.archive_name }}

      - name: Package Linux Binary
        if: runner.os == 'Linux'
        run: |
          tar -czvf ${{ matrix.archive_name }} -C build/bin logpulse

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.archive_name }}

      - name: Publish Release Asset (Tag Only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
